# Publishes to npm WITH a sigstore provenance attestation.
# Provenance can only be generated from a supported CI with OIDC -- a local
# `npm publish --provenance` fails. This is the only path that puts
# `dist.attestations` on the published artifact.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Sanity — package loads
        run: node -e "require('./index.cjs'); console.log('index.cjs OK')"
      - name: Publish with provenance
        # Idempotent on purpose: this workflow publishes to TWO registries, and a
        # hard failure on an already-published npm version would abort the job
        # before the MCP Registry step ever ran -- which is how the Registry got
        # four versions behind in the first place. A version already on npm is
        # not an error condition for a run whose remaining work is downstream.
        run: |
          V=$(node -p "require('./package.json').version")
          if curl -sf "https://registry.npmjs.org/stillos-notary-mcp/$V" > /dev/null; then
            echo "npm already has $V — skipping publish, continuing to the Registry"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ---- Official MCP Registry ------------------------------------------
      # Added 2026-09-22 (stillos-notary-mcp#1, Heaviside479). npm publishing and
      # Registry publishing were separate manual acts, so the Registry silently
      # fell four releases behind -- serving 1.2.0 install metadata, status
      # "active", isLatest true, with nothing anywhere saying it was stale. The
      # only defence against that recurring is publishing both from one run.
      #
      # github-oidc needs no human and no stored credential: the Registry trusts
      # this repo's OIDC identity for the io.github.stillmarcus24/* namespace,
      # which is exactly why the interactive device flow is the wrong tool here.
      - name: Wait for npm to serve the new version
        # The Registry validates that the npm version really exists. npm's
        # packument is CDN-cached and lagged ~1 min on the 1.3.4 publish, so
        # publishing straight through races that cache and fails on a version
        # that is genuinely there.
        run: |
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if curl -sf "https://registry.npmjs.org/stillos-notary-mcp/$V" > /dev/null; then
              echo "npm serving $V after ${i} attempt(s)"; exit 0
            fi
            sleep 10
          done
          echo "npm did not serve $V within 300s"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Publish to the Official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
