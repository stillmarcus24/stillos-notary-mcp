# Publishes to npm WITH a sigstore provenance attestation.
# Provenance can only be generated from a supported CI with OIDC -- a local
# `npm publish --provenance` fails. This is the only path that puts
# `dist.attestations` on the published artifact.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Sanity — package loads
        run: node -e "require('./index.cjs'); console.log('index.cjs OK')"
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
